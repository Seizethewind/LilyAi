[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilyai"
version = "0.1.0"
description = "An AI system built from the ground up: our own model, trained by us."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["main", "config"]

[tool.setuptools.packages.find]
include = [
    "core*", "cognition*", "model*", "training*", "memory*",
    "knowledge*", "tools*", "conversation*", "safety*", "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
