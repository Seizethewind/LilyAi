name: Inspect termux terminal library

# Temporary: prints the exact classes and methods of Termux's terminal-view and terminal-emulator libraries so the in-app
# terminal is written against what is really there. Delete once the terminal screen compiles.

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-termux-lib.yml']

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Download the libraries from JitPack (it builds them on first request, so retry)
        run: |
          VER=v0.118.0
          BASE=https://jitpack.io/com/github/termux/termux-app
          for art in terminal-view terminal-emulator; do
            ok=0
            for i in $(seq 1 20); do
              if curl -fsSL -o "$art.aar" "$BASE/$art/$VER/$art-$VER.aar"; then ok=1; break; fi
              echo "$art attempt $i failed, waiting"; sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::could not download $art"; exit 1; }
            ls -la "$art.aar"; sha256sum "$art.aar"
            mkdir "x-$art"; unzip -q "$art.aar" -d "x-$art"; find "x-$art" -type f | sort | head -40
          done
      - name: Public API
        run: |
          CP=x-terminal-view/classes.jar:x-terminal-emulator/classes.jar
          for c in com.termux.view.TerminalView com.termux.view.TerminalViewClient com.termux.terminal.TerminalSession \
                   com.termux.terminal.TerminalSessionClient com.termux.terminal.TerminalEmulator com.termux.terminal.JNI \
                   com.termux.terminal.TerminalColors com.termux.terminal.TextStyle com.termux.terminal.KeyHandler; do
            echo "=================== $c"; javap -public -cp "$CP" "$c" || true
          done
      - name: Native libraries and POM
        run: |
          find x-terminal-emulator -name '*.so' | sort
          for f in x-terminal-view/AndroidManifest.xml x-terminal-emulator/AndroidManifest.xml; do echo "--- $f"; cat "$f"; echo; done
